  <g font-family="&#39;JetBrains Mono&#39;, monospace" fill="#c1272d" font-size="9" letter-spacing="2" opacity="0.7">
    <text x="48" y="356">v1.0.0</text>
    <text x="752" y="356" text-anchor="end">EST 2026</text>
