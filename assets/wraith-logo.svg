  <g font-family="&#39;Rye&#39;, &#39;Smokum&#39;, &#39;Rozha One&#39;, Georgia, serif" font-weight="400">
    
    <text x="402" y="298" text-anchor="middle" font-size="86" fill="#00d9ff" opacity="0.18" letter-spacing="8">WRAITH</text>
    
    <text x="398" y="298" text-anchor="middle" font-size="86" fill="#7a1418" opacity="0.6" letter-spacing="8">WRAITH</text>
    
    <text x="400" y="298" text-anchor="middle" font-size="86" fill="url(#bloodType)" letter-spacing="8" filter="url(#rough)">WRAITH</text>

    
    <g fill="#0a0303">
