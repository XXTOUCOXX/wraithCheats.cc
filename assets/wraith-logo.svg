      <rect x="-1" y="6" width="3" height="9"></rect>
      <rect x="3" y="6" width="3" height="8"></rect>
      <rect x="7" y="6" width="2.5" height="7"></rect>
    </g>

    
    <g stroke="#3a1c1d" stroke-width="1" fill="#1a1310" opacity="0.85" transform="translate(0,0)">
      
      <g transform="rotate(-35)">
