    <circle cx="12" cy="-22" r="6" fill="#c1272d" opacity="0.35" filter="url(#bloodGlow)"></circle>

    
    <path d="M 0,-14 L -3,-4 L -1,-1 L 1,-1 L 3,-4 Z" fill="#0a0303"></path>

    
    <path d="M -22,-12 L -16,-2 L -12,-4 Z" fill="#5a4f3a" opacity="0.5"></path>
    <path d="M 22,-12 L 16,-2 L 12,-4 Z" fill="#5a4f3a" opacity="0.5"></path>

    
